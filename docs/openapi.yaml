openapi: 3.0.3
info:
  title: RAG Service API
  version: 1.0.0
  description: |
    Rails API for document ingest, chunking, embeddings (pgvector), and retrieval.
    Clients bring their own LLM for generation.

    Authenticated tenant routes expect `Authorization: Bearer rag_...`.
    Operator minting uses `OPERATOR_API_KEY` via Bearer or `X-Operator-Key`.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: ApiKeys
  - name: Documents
  - name: Query
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /openapi.yaml:
    get:
      tags: [Health]
      summary: OpenAPI document
      security: []
      responses:
        "200":
          description: OpenAPI 3 YAML
          content:
            application/yaml:
              schema:
                type: string
  /api_keys:
    post:
      tags: [ApiKeys]
      summary: Mint a tenant API key (operator)
      security:
        - OperatorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    tenant_id:
                      type: integer
                    tenant_name:
                      type: string
                    tenant_webhook_url:
                      type: string
                      format: uri
                      description: Optional ingest status webhook URL for the tenant
                    tenant_webhook_secret:
                      type: string
                      description: Optional HMAC secret for X-Rag-Signature
      responses:
        "201":
          description: Created (raw token returned once)
        "401":
          description: Unauthorized
        "422":
          description: Invalid request
  /documents:
    get:
      tags: [Documents]
      summary: List documents (cursor pagination)
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: after
          in: query
          schema:
            type: string
          description: Cursor from pagination.next_cursor
        - name: namespace
          in: query
          schema:
            type: string
          description: Filter documents to a namespace within the tenant
      responses:
        "200":
          description: Document page
    post:
      tags: [Documents]
      summary: Create document (text or file upload)
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: When set, duplicate creates for the same tenant replay the original document (200) without re-ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
                    source_type:
                      type: string
                      enum: [text, pdf, html]
                    namespace:
                      type: string
                      default: default
                      description: Isolation namespace within the tenant (letters, digits, . _ -)
          multipart/form-data:
            schema:
              type: object
              properties:
                document[title]:
                  type: string
                document[file]:
                  type: string
                  format: binary
      responses:
        "202":
          description: Accepted for ingest
        "200":
          description: Idempotent replay of an existing document
  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document (poll status until ready or failed)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document
        "404":
          description: Not found
    delete:
      tags: [Documents]
      summary: Delete document
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted
  /documents/{id}/reindex:
    post:
      tags: [Documents]
      summary: Re-chunk and re-embed a document
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Reindex accepted
        "409":
          description: Already processing
  /query:
    post:
      tags: [Query]
      summary: Retrieve relevant chunks (no LLM generation)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                top_k:
                  type: integer
                namespace:
                  type: string
                  description: Limit retrieval to chunks in this namespace; omit to search all namespaces for the tenant
                mode:
                  type: string
                  enum: [vector, hybrid]
                  default: vector
                  description: vector = cosine kNN only; hybrid = keyword FTS + vector fused with RRF
      responses:
        "200":
          description: Chunks
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: rag_...
      description: Tenant API key
    OperatorKey:
      type: http
      scheme: bearer
      description: OPERATOR_API_KEY (or X-Operator-Key header)
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Document:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        source_type:
          type: string
        namespace:
          type: string
          default: default
        status:
          type: string
          enum: [pending, processing, ready, failed]
        error_message:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IngestWebhookPayload:
      type: object
      description: POSTed to tenant.webhook_url on terminal ingest status
      properties:
        event:
          type: string
          example: document.ingest.ready
        document_id:
          type: integer
        status:
          type: string
          enum: [ready, failed]
        error_message:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
security:
  - BearerAuth: []
