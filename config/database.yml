default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://rag_service:rag_service@localhost:5433/rag_service_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://rag_service:rag_service@localhost:5433/rag_service_test") %>

production:
  primary: &primary_production
    <<: *default
    database: rag_service_production
    username: rag_service
    password: <%= ENV["RAG_SERVICE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rag_service_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rag_service_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rag_service_production_cable
    migrations_paths: db/cable_migrate
