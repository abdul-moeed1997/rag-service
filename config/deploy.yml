# Kamal deploy config for RAG Service.
# Before first deploy: set servers.web / accessories.db.host, proxy.host, then
# export KAMAL_REGISTRY_PASSWORD (GHCR token), POSTGRES_PASSWORD, OPERATOR_API_KEY,
# the embedding provider key, and the two ACTIVE_RECORD_ENCRYPTION_* keys.
# The app refuses to boot in production if the embedding or encryption settings are missing.

service: rag_service

# GHCR image: ghcr.io/abdul-moeed1997/rag-service
image: abdul-moeed1997/rag-service

servers:
  web:
    - 192.168.0.1
  # Ingest jobs run in their own container so a heavy PDF does not slow down queries.
  job:
    hosts:
      - 192.168.0.1
    cmd: bin/jobs

# Let's Encrypt via kamal-proxy. Requires config.assume_ssl / force_ssl (enabled in production.rb).
# Point DNS A/AAAA for this host at the server IP before first deploy.
proxy:
  ssl: true
  host: rag.example.com
  # Health check used by the proxy
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: abdul-moeed1997
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - RAG_SERVICE_DATABASE_PASSWORD
    - OPERATOR_API_KEY
    - OPENAI_API_KEY
    - VOYAGE_API_KEY
    - EMBEDDING_API_KEY
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  clear:
    DB_HOST: rag_service-db
    DB_USERNAME: rag_service
    # openai, voyage, or local. "fake" is refused in production unless
    # ALLOW_FAKE_EMBEDDINGS is "true" (demo only: search results are meaningless).
    # openai's text-embedding-3-small matches the schema's vector(1536).
    EMBEDDING_PROVIDER: openai
    EMBEDDING_DIMENSIONS: 1536
    LOG_FORMAT: json
    RAILS_LOG_LEVEL: info
    # Other provider settings:
    # OPENAI_EMBEDDING_MODEL: text-embedding-3-small
    # VOYAGE_EMBEDDING_MODEL: voyage-3
    # EMBEDDING_BASE_URL: http://embeddings:11434
    # LOCAL_EMBEDDING_MODEL: nomic-embed-text

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "rag_service_storage:/rails/storage"

builder:
  arch: amd64

accessories:
  db:
    image: pgvector/pgvector:pg17
    host: 192.168.0.1
    # Bound to loopback only; app reaches it as rag_service-db on the Kamal network.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: rag_service
        POSTGRES_DB: rag_service_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/postgres/production.sql:/docker-entrypoint-initdb.d/00-setup.sql
    directories:
      - data:/var/lib/postgresql/data
