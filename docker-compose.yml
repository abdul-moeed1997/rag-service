services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service
      POSTGRES_DB: rag_service_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_service -d rag_service_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
